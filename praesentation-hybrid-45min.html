<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernwerk · 45 Minuten plus Reserve · LMZ</title><script src="composition-hybrid/assets/runtime/hyperframes-player.global.js"></script><script src="composition-hybrid/assets/runtime/hyperframes-slideshow.global.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111a24;font-family:system-ui,sans-serif}hyperframes-slideshow{display:block;position:relative;width:100%;height:100%}.study{position:fixed;right:22px;top:16px;z-index:60;color:#172b50;background:#f7f7f0;padding:10px 16px;border-radius:6px;font-size:15px;text-decoration:none}.study:focus-visible{outline:3px solid #2d52ee;outline-offset:4px}html.audience .study{display:none}</style><script>if(new URLSearchParams(location.search).get('mode')==='audience')document.documentElement.classList.add('audience');</script><style>html.review-detail-open .study,html.review-detail-open [data-hf-nav-cluster]{visibility:hidden!important}</style></head><body><hyperframes-slideshow tabindex="0" notes-storage-key="lmz-lernwerk-hybrid-45min-20261019"><hyperframes-player interactive src="composition-hybrid/index.html" style="position:absolute;inset:0"></hyperframes-player><script type="application/hyperframes-slideshow+json">{"slides":[{"sceneId":"i1-erleben","notes":"Richtzeit: 1,5 Minuten. Persönliche Leitfrage vor der ersten Spielaktion: Was kann ich als Fachexperte mit KI fürs Lernen erschaffen, das ich technisch allein nicht umsetzen könnte? Dann nur die Schattenwand als beeindruckendes Ergebnis zeigen. Kurz umsehen oder wenige Schritte gehen; keine geführte Wendung und kein Licht vorwegnehmen. Ein Satz ordnet die Situation für Menschen ohne Kenntnis des Gleichnisses ein. Das freie Spiel bleibt bedienbar. Übergang: Wie viel musste ich dafür eigentlich formulieren?","startTime":180,"endTime":190},{"sceneId":"i2-prompts","notes":"Richtzeit: 1 Minuten. Die beiden tatsächlichen Nutzeraufträge zeigen. Erster Auftrag: begehbare Wireframe-Welt. Zweiter Auftrag: die First-Person-Erfahrung und Wahrnehmungsgrenzen gezielt verbessern. Originalwortlaut erhalten. Zwei sichtbare Aufträge beschreiben den Formulierungsaufwand, keine Garantie über sämtliche Rechen- oder Prüfschritte. Übergang: Das Ergebnis ist eindrucksvoll. Jetzt drehen wir uns um und schauen hinter die Mauer.","startTime":190,"endTime":200},{"sceneId":"i3-wendung","notes":"Richtzeit: 1,5 Minuten. Die Wendung erst jetzt enthüllen. Überblick hinter der Mauer, Figuren und ihre Stäbe, Feuer mit Hilfsstrahlen, dann Zusammenhang ansehen. Die vorhandenen Einblendungspunkte führen die Blickwechsel. Schattenspiel ist eine produktive Tätigkeit: Anordnung und Werkzeuge bewusst nutzen. Kein bestimmtes KI-Bauteil mit dem Feuer gleichsetzen. Die Orte sind Perspektiven mit Rückwegen, keine zwangsläufigen Fähigkeitsstufen. Übergang: Mich interessiert, welche Lernformen ich selbst mit solchen Mitteln erschaffen kann.","fragments":[200.5,202,205,208],"hotspots":[{"id":"hoehle-vertiefen","label":"Übertragung und Grenzen","target":"v-hoehle-ki","region":{"x":66,"y":87,"w":28,"h":7}}],"startTime":200,"endTime":210},{"sceneId":"i4-motivation","notes":"Richtzeit: 1 Minuten. Die persönliche Gestaltungsabsicht aufgreifen. Fachwissen und Ziele, Quellen und Kriterien sowie KI als Produktionsmedium verbinden. Die eigene Expertise wächst durch Prüfung und Austausch; ihre Grenzen bleiben erkennbar. Übergang: Am Lernwerk zeige ich jetzt, welche Arbeit hinter einer fertigen Darstellung steckt.","startTime":210,"endTime":220},{"sceneId":"root","startTime":0,"endTime":10,"notes":"Richtzeit: 0,5 Minuten. Den Rechercheausschnitt als Blick hinter das fertige Lernangebot einordnen. Aus einer umfangreichen Quellenkarte wurde eine wachsende Notiz. Eine einzige Entwicklungsspur ankündigen, nicht schon das Produkt vorführen. Übergang: Wie mache ich meinen fachlichen Auftrag für die Werkzeuge bearbeitbar?","hotspots":[{"id":"vertiefung-1","label":"Vertiefung","target":"v1-entwicklung","region":{"x":78,"y":85,"w":16,"h":7}}]},{"sceneId":"e2-werkzeuge","fragments":[12,15],"notes":"Richtzeit: 1,5 Minuten. Eine Arbeitsfolge führen: Ziel, Lernbogen und Quellen als Kontext; mit Codex Dateien und Browser konkret bearbeiten; einen belegten Befund gezielt korrigieren und nachprüfen. Workspace, Git/GitHub und HyperFrames knapp nach ihrer Rolle benennen. Keine ausführliche Werkzeugtour. Den verdichteten Beispielauftrag als solchen kennzeichnen. Übergang ins Freie: Die Werkzeuge helfen beim Herstellen. Welche Lernform ich brauche, muss ich fachlich begründen.","hotspots":[{"id":"vertiefung-2","label":"Vertiefung","target":"v2-werkzeuge","region":{"x":78,"y":85,"w":16,"h":7}}]},{"sceneId":"g1-massstaebe","startTime":280,"endTime":290,"fragments":[282,285,288],"notes":"Richtzeit: 1,25 Minuten. Der Außenraum erhält hier seinen ersten geführten Moment. Wissen und Maßstäbe durch Forschung, Lesen, Bildungsplan und Austausch erschließen. Die drei vorhandenen Einblendungen unterscheiden Grundlage, curricularen Wortlaut und eigene Gestaltungsentscheidung. Keine fertige Wahrheit oder automatisch abgeleitete Form behaupten. Übergang: Mit diesen Maßstäben gehe ich zurück an die Werkbank und entwickle einen Bauplan."},{"sceneId":"g2-konzeption","startTime":290,"endTime":300,"fragments":[292,295,298],"notes":"Richtzeit: 1,5 Minuten. Den unveränderten Bauplan zeigen: erklärender Kernlernweg, eigene Anwendung, Rückmeldung und neuer Versuch; flexible Vertiefungs-, Transfer- und Projektmodule. Zielbild Gymnasium 5–7, kein Fertigstellungsnachweis. Die Funktionen einmal deutlich erklären. Übergang: Jetzt erhält ein konkretes Bildungsplanziel seinen Ort in diesem Bauplan."},{"sceneId":"e3-grundlagen","fragments":[22,25,28],"notes":"Richtzeit: 2,25 Minuten. Das Jahresmapping bleibt vollständig. Quelle lesen, Bandziel durch eigene Jahrgangsentscheidung auf 5 und 6 verteilen, Lernhandlung und Nachweis planen. Quellenaussage und Projektentscheidung unterscheiden. Die vorhandenen drei Einblendungen in Ruhe nutzen. Übergang: Diese Handlung braucht auch Platz im Schuljahr.","hotspots":[{"id":"vertiefung-3","label":"Mapping vertiefen","target":"v3-grundlagen","region":{"x":78,"y":85,"w":16,"h":7}}]},{"sceneId":"e4-lernbogen","fragments":[32,36],"notes":"Richtzeit: 2 Minuten. Die Jahresbilanz und den Rechercheausschnitt unverändert zeigen. 225 Minuten entsprechen fünf Unterrichtseinheiten zu 45 Minuten; die sechs Lernschritte sind eine andere Gliederung. 38 UE sind ein geplanter Bedarf, noch keine bestätigte Verfügbarkeit oder erprobte Dauer. Die Vertiefung bleibt für das Selbststudium. Übergang: Eine Zeitbilanz allein macht den Einstieg noch nicht verständlich. Dafür musste ich das Material überarbeiten.","hotspots":[{"id":"vertiefung-4","label":"M02 genauer ansehen","target":"v4-lernbogen","region":{"x":78,"y":85,"w":16,"h":7}}]},{"sceneId":"e5-recherche","notes":"Richtzeit: 1 Minute. Historische Revision 11.–12.10.2026, heute im zusätzlichen Recherche-Beispiel. Kleine Notiz: Antwort, hilfreiche Textstelle, Herkunft. Entlastung ist eine Gestaltungsabsicht, noch kein Nachweis besserer Lernwirkung. Übergang: Auch danach blieb zunächst eine Lernhandlung aus.","hotspots":[{"id":"vertiefung-5","label":"Vertiefung","target":"v5-recherche","region":{"x":78,"y":85,"w":16,"h":7}}]},{"sceneId":"e6-review","notes":"Richtzeit: 1,5 Minuten. Originalbilder A09 und A10 aus der veröffentlichten Fassung zeigen. Links stehen zwei echte Auszüge bei noch leerer Notiz; rechts hebt Lea ihre Auswahl hervor. Ein Bild lässt sich im Fenster vergrößern. Historischer Befund vom 12.10.: passende Passage war vorgegeben. Im aktuellen Material ist die eigene Wahl empfohlen, der Vergleich freiwillig erreichbar; keine technische Sperre. Im Vortrag nur die beiden Bilder erklären, die echte Seite ist zusätzlich im Fenster aufrufbar. Übergang: Dasselbe Vorgehen lässt sich an mehreren Roboterentwürfen nachvollziehen.","hotspots":[{"id":"vertiefung-6","label":"Review vertiefen","target":"v6-review","region":{"x":55,"y":9,"w":18,"h":5}}]},{"sceneId":"e7-medien","notes":"Richtzeit: 1,5 Minuten. Exemplarische Entwicklungsspur, kein vollständiger Stammbaum: erster Reinigungsfall am 13.09.; Lernfassung 2 nach konkretem Lernendenperspektiv-Review; am 20.09. neuer Anspruch vollständiger Selbstlernbearbeitbarkeit; spätere Ausarbeitung bis zum konsolidierten Lernstudio am 27.09., heute in Klasse 5. Die historischen Fassungen sind im Fenster bedienbar. Im Vortrag nicht alle öffnen. Konkrete Verbesserungen: passendes Feedback, sichtbarer Schleifendurchlauf, ergänzte Erklärungen und Kriterien. Verdichteter Revisionsauftrag ist kein Originalprompt. Designübertragung und technische Checks beweisen keine Lernwirkung. Übergang: Jetzt prüfen wir im echten Lernstudio, was aus diesen Entscheidungen sichtbar geworden ist.","hotspots":[{"id":"vertiefung-7","label":"Arbeitsweise vertiefen","target":"v7-medien","region":{"x":55,"y":9,"w":18,"h":5}}]},{"sceneId":"d1-lernwerk-betreten","startTime":300,"endTime":310,"notes":"Richtzeit: 0,5 Minuten. Die Entwicklungslinie endet im heutigen Lernstudio. Dieses ist eine zusätzliche Übung zur vollständigen Ablauf-Reihe. Vermuten, Fehler finden und Korrektur begründen. Keine vollständige Produkt- oder Versionsführung."},{"sceneId":"d2-roboter-live","startTime":310,"endTime":320,"notes":"Richtzeit: 6 Minuten. Erst vor/links/vor vorhersagen und einzeln prüfen. Im Fehlerfall wiederhole 4 [vor], danach links: aktueller 2×2-Raum stoppt bei Aktion 2. Der sichtbare Merksatz nennt die Lösungsidee bereits. Daher begründete Rekonstruktion der vorgegebenen Regel, keine völlig offene Fehlersuche behaupten. Zu wiederhole 4 [vor; links] ändern, äußere Drehung entfernen. Vier Kacheln, acht Aktionen, Rückkehr zum Start mit Blick rechts prüfen. Erklärung mit Kriterien beurteilen. Kein Kompetenznachweis aus einer Fahrt."},{"sceneId":"d3-konzeption-erkennen","startTime":320,"endTime":330,"notes":"Richtzeit: 1,5 Minuten. Am gerade Erlebten die drei Funktionen zuordnen, nicht die ganze Konzeption erneut erklären. Hilfe am Programm; eigene Vorhersage und Korrektur; Rückmeldung und begründeter neuer Versuch. Technik prüft die Fahrt. Fachliches Urteil beurteilt die Erklärung. Reale Erprobung mit Lernenden bleibt eine eigene Aufgabe; die zusätzliche Übersicht steht in der Vertiefung. Übergang: Ihr erkundet jetzt selbst, was eure Entscheidung trägt. Nur einen der beiden kurzen Ausschnitte wählen.","fragments":[322,325,328],"hotspots":[{"id":"pruefungen-vertiefen","label":"Prüfungen und Grenzen","target":"v8-qualitaet","region":{"x":75,"y":80,"w":21,"h":6}}]},{"sceneId":"t1-testweg-waehlen","startTime":330,"endTime":340,"notes":"Richtzeit: 1 Minute. Einladung zum freien Erkunden, keine Zuteilung und kein Arbeitsauftrag. Zwei bekannte Einstiege anbieten; eigene Wege, Zuschauen und Mitdenken sind genauso möglich. Für Online-Teilnahme beide öffentlichen URLs vorab manuell in den Teams-Chat geben; Kopierhilfe in der Präsentation/Lesefassung. Niemand muss zwischen Bildschirmfreigabe und eigenem Ausprobieren gleichzeitig alles verfolgen."},{"sceneId":"t2-testen-beobachten","startTime":340,"endTime":350,"notes":"Richtzeit: 8 Minuten. Zeit zum Erkunden lassen. Keine laufenden Beobachtungsfragen, keine Pflichtnotiz, keine Breakout- oder Partneraufgabe. Als Referent für Fragen erreichbar sein; Raum und Teams im Blick behalten. Nach etwa sieben Minuten freundlich auf den baldigen Austausch hinweisen. Auch reines Mitdenken ist willkommen."},{"sceneId":"t3-befund-schaerfen","startTime":350,"endTime":360,"notes":"Richtzeit: 1 Minute. Den Übergang zum Gespräch öffnen: Was möchtet ihr mitbringen? Kein Befundschema, keine Abgabe und kein zu schärfender Satz. Kurz Raum lassen, bevor die gemeinsame Runde beginnt."},{"sceneId":"f1-beobachtungen-buendeln","startTime":360,"endTime":370,"notes":"Richtzeit: 3 Minuten innerhalb eines insgesamt fünfminütigen offenen Gesprächs. Eine Frage eröffnen: Wie wirkt das Lernwerk auf euch? Danach zuhören und nachfragen. Beiträge aus dem Raum, per Teams-Mikrofon und im Chat gleichwertig aufnehmen. Nach Möglichkeit vorab jemanden bitten, den Chat mit im Blick zu behalten. Keine drei Pflichtbeiträge, keine Kategorien, kein sichtbares Protokoll und keine festgelegten Redezeiten. Die Zeit still selbst im Blick behalten."},{"sceneId":"f2-fragen-naechster-schritt","startTime":370,"endTime":380,"notes":"Richtzeit: weitere 2 Minuten desselben Gesprächs. Folie ist eine offene Einladung zu Fragen und darf bei laufendem Gespräch auch geschlossen bleiben. Keinen Themenwechsel erzwingen. Fragen zur Konzeption, KI-Arbeit oder Praxis aufnehmen; keine gemeinsame Priorität oder ein Prüfzeichen abfragen. Zum Ausblick nur einen tatsächlich gehörten Gedanken aufgreifen, wenn es passt; sonst einfach danken."},{"sceneId":"a1-lernwege-verbessern","startTime":380,"endTime":390,"notes":"Richtzeit: 0,5 Minuten. Eigene nächste Priorität nennen: bestehende Lernwege verbessern. Für Perspektiven danken, ohne ein gemeinsames Ergebnis zu behaupten. Optional einen tatsächlichen Gedanken aus dem Gespräch aufgreifen. Keine automatische Übernahme aus einem Sammelraster."},{"sceneId":"a2-reviews-beitragen","startTime":390,"endTime":400,"notes":"Richtzeit: 2 Minuten. Freiwilliges Weiterdenken über das LMZ-Teams anbieten. Ein kurzer Gedanke, eine Frage, Praxiserfahrung oder ein genauerer fachlicher/didaktischer Blick sind willkommen. Kein Auftrag an alle, keine Pflichtvorlage oder Abgabe. Die optionale Schreibhilfe steht nur im Selbststudium. Menschliche Expertise als Einladung zum Austausch würdigen."},{"sceneId":"a3-menschliche-expertise","startTime":400,"endTime":410,"notes":"Richtzeit: 1,5 Minuten. Zur persönlichen Leitfrage und zur Werkbank zurückkehren. Eigene Expertise, Erfahrung und andere Perspektiven geben der KI-Produktion Richtung. Kollegial schließen, keine neue Aufgabe formulieren."}],"slideSequences":[{"id":"v1-entwicklung","label":"Entwicklung des Lernwerks","slides":[{"sceneId":"v1-entwicklung","notes":"Vertiefung zu Folie 1. Über Zurück zur Vortragsfolie wechseln. Quellen: Q01, Q04, Q08, Q09","startTime":80,"endTime":90}]},{"id":"v2-werkzeuge","label":"Werkzeuge im Entwicklungsprozess","slides":[{"sceneId":"v2-werkzeuge","notes":"Vertiefung zu Folie 2. Über Zurück zur Vortragsfolie wechseln. Quellen: Q01, Q02, Q05, Q10, Q11, Q07, Q08, Q09","startTime":90,"endTime":100}]},{"id":"v3-grundlagen","label":"Das Mapping vom Ziel zur Lernhandlung","slides":[{"sceneId":"v3-grundlagen","notes":"Vertiefung zu Folie 3. Über Zurück zur Vortragsfolie wechseln. Quellen: Q02, Q03, Q06, Q07, Q12","startTime":100,"endTime":110},{"sceneId":"v3-grundlagen-mapping-nachweis","notes":"Vertiefung zu Das Mapping vom Ziel zur Lernhandlung. Quellen: Q02, Q03, Q06, Q07, Q12","startTime":160,"endTime":170}]},{"id":"v4-lernbogen","label":"Das Mapping in den Jahresplan","slides":[{"sceneId":"v4-lernbogen","notes":"Vertiefung zu Folie 4. Über Zurück zur Vortragsfolie wechseln. Quellen: Q05, Q06, Q07, Q12","startTime":110,"endTime":120},{"sceneId":"v4-lernbogen-mapping-recherchezeit","notes":"Vertiefung zu Das Mapping in den Jahresplan. Quellen: Q05, Q06, Q07, Q12","startTime":170,"endTime":180}]},{"id":"v5-recherche","label":"Recherche als Entwicklungsbeispiel","slides":[{"sceneId":"v5-recherche","notes":"Vertiefung zu Folie 5. Über Zurück zur Vortragsfolie wechseln. Quellen: Q07, Q08","startTime":120,"endTime":130}]},{"id":"v6-review","label":"Kritik wird zur konkreten Änderung","slides":[{"sceneId":"v6-review","notes":"Vertiefung zu Folie 6. Über Zurück zur Vortragsfolie wechseln. Quellen: Q08, Q09","startTime":130,"endTime":140}]},{"id":"v7-medien","label":"Entwürfe prüfen und gezielt überarbeiten","slides":[{"sceneId":"v7-medien","notes":"Vertiefung zur Roboterentwicklung. Beobachtung, fachliches Kriterium, begrenzter Auftrag und erneute Prüfung auseinanderhalten. Der Beispielauftrag ist eine redaktionelle Verdichtung, kein historisches Originalzitat. Quellen R02–R07 im Prüfbericht. Die Medienübersicht zur Recherche bleibt in der Lesefassung.","startTime":140,"endTime":150}]},{"id":"v8-qualitaet","label":"Qualität und verbleibende Nachweise","slides":[{"sceneId":"e8-qualitaet","notes":"Optionale Vertiefung: technische Prüfung, fachliches Urteil und reale Erprobung. Außerhalb der 45 geplanten Minuten.","startTime":70,"endTime":80},{"sceneId":"v8-qualitaet","notes":"Vertiefung zu Folie 8. Über Zurück zur Vortragsfolie wechseln. Quellen: Q05, Q09, Q10","startTime":150,"endTime":160}]},{"id":"v-hoehle-ki","label":"Höhlengleichnis und KI · Übertragung und Grenzen","slides":[{"sceneId":"v-hoehle-ki-motive","notes":"Optionale Vertiefung zum Selbststudium. Die Motive öffnen verschiedene Fragen an die KI-Nutzung. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":220,"endTime":230},{"sceneId":"v-hoehle-ki-nachweise","notes":"Optionale Vertiefung zum Selbststudium. Ein Prüfprozess wird durch seine Nachweise beurteilbar. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":230,"endTime":240},{"sceneId":"v-hoehle-ki-drei-fragen","notes":"Optionale Vertiefung zum Selbststudium. Produkt, eigenes Verständnis und Lernzuwachs brauchen eigene Nachweise. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":240,"endTime":250},{"sceneId":"v-hoehle-ki-expertise","notes":"Optionale Vertiefung zum Selbststudium. Eigenes Fachverständnis und externe Prüfung leisten Unterschiedliches. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":250,"endTime":260},{"sceneId":"v-hoehle-ki-grenzen","notes":"Optionale Vertiefung zum Selbststudium. Die Höhlenübertragung hat klare Grenzen. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":260,"endTime":270},{"sceneId":"v-hoehle-ki-lernen","notes":"Optionale Vertiefung zum Selbststudium. Lernziele bestimmen, welche Arbeit wir selbst leisten und welche wir delegieren. Volltext und Quellen über den Lesefassungslink. Über „Zurück“ zur Einstiegsfolie wechseln.","startTime":270,"endTime":280}]}]}</script></hyperframes-slideshow><a class="study" href="composition-hybrid/lesen.html" target="_blank" rel="noopener">Selbststudium und Quellen</a><script>document.querySelector("hyperframes-slideshow").focus();</script><script src="composition-hybrid/assets/runtime/feedback-stage.js"></script><script>window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.source!=='lmz-review-ui')return;document.documentElement.classList.toggle('review-detail-open',Boolean(e.data.open));if(parent!==window)parent.postMessage(e.data,location.origin);});</script></body></html>
